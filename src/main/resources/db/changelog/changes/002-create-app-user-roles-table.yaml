databaseChangeLog:
  - changeSet:
      id: 002-create-app-user-roles-table
      author: prashant

      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: app_user_roles

      changes:
        - createTable:
            tableName: app_user_roles
            columns:

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: roles
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: app_user_roles
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_app_user_roles_user

        - createIndex:
            tableName: app_user_roles
            indexName: idx_app_user_roles_user_id
            columns:
              - column:
                  name: user_id

      rollback:
        - dropTable:
            tableName: app_user_roles